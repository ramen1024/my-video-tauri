[package]
name = "video-scanner"
version = "0.3.4"
description = "视频扫描播放工具"
authors = ["YHY"]
edition = "2021"

[lib]
name = "video_scanner_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "video-scanner"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 本包的 build script 不直接使用 indexmap；显式声明是为了在 build-dependency
# （host 单元）的 feature 统一里强制打开它的 `std` feature。背景：schemars 0.8
# 是 tauri-build 的传递依赖，按 `IndexMap<K, V>` 两参数使用 indexmap 1.9.3，
# 该写法只在 `has_std` cfg（S 参数带 RandomState 默认值）下合法；cargo 1.98+
# 的 resolver 在 build-dep 单元里不再打开 std（autocfg 的 sysroot 探测也失败），
# no_std 形态的 `IndexMap<K, V, S>`（S 无默认值）令 schemars 报 E0107，
# rustc 1.98/1.99 下无法编译。schemars 0.8 已停止维护、版本由 tauri 决定，
# 只能在这一侧强制。
indexmap = { version = "1.9.3", features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = "0.4"
tiny_http = "0.12"
parking_lot = "0.12"
rand = "0.9"
argon2 = "0.5"
percent-encoding = "2"
log = "0.4"
env_logger = "0.11"
if-addrs = "0.13"
sha2 = "0.10"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
