[package]
name = "video-scanner"
version = "0.3.1"
description = "视频扫描播放工具"
authors = ["you"]
edition = "2021"

[lib]
name = "video_scanner_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "video-scanner"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = "0.4"
tiny_http = "0.12"
parking_lot = "0.12"
rayon = "1.7"
rand = "0.9"
argon2 = "0.5"
percent-encoding = "2"
log = "0.4"
env_logger = "0.11"
if-addrs = "0.13"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
