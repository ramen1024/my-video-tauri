[package]
name = "视频扫描器"
version = "0.3.1"
description = "视频扫描播放工具"
authors = ["you"]
edition = "2021"

[lib]
name = "video_scanner_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "视频扫描器"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = "0.4"
tiny_http = "0.12"
parking_lot = "0.12"
rayon = "1.7"
once_cell = "1"
rand = "0.8"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 2
