[package]
name = "视频扫描器"
version = "0.2.8"
description = "视频扫描播放工具"
authors = ["you"]
edition = "2021"

[lib]
name = "video_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "视频扫描器"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = "0.4"
tiny_http = "0.12"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
once_cell = "1"

