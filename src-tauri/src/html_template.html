<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频扫描器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f172a;
            --surface: #111827;
            --surface-hover: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.06);
            --text: #f8fafc;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --danger: #fca5a5;
            --radius: 10px;
        }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        /* Header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            color: var(--accent);
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .addresses {
            font-size: 12px;
            color: var(--text-tertiary);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .address-item {
            color: var(--accent-light);
            font-weight: 500;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
            max-width: 320px;
        }

        .search-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: var(--text-tertiary);
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            font-size: 13px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(255, 255, 255, 0.06);
        }

        .search-box input::placeholder {
            color: var(--text-tertiary);
        }

        .toolbar-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .stat {
            display: flex;
            align-items: baseline;
            gap: 5px;
        }

        .stat-value {
            font-weight: 700;
            color: var(--text);
        }

        .refresh-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
        }

        .refresh-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .refresh-btn svg {
            width: 14px;
            height: 14px;
        }

        .refresh-btn.spinning svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Video list */
        .video-list {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
            max-height: calc(100vh - 220px);
            overflow-y: auto;
        }

        .list-header {
            display: grid;
            grid-template-columns: minmax(200px, 1fr) 100px 150px 72px;
            align-items: center;
            padding: 10px 16px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            font-weight: 700;
            color: var(--text-tertiary);
            letter-spacing: 0.4px;
            text-transform: uppercase;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .list-header button {
            background: none;
            border: none;
            color: inherit;
            font: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 0;
            transition: color 0.15s ease;
        }

        .list-header button:hover {
            color: var(--text);
        }

        .list-header button.active {
            color: var(--accent-light);
        }

        .list-header button svg {
            width: 12px;
            height: 12px;
        }

        .header-size,
        .header-action {
            text-align: right;
        }

        .video-scroll-spacer {
            width: 1px;
        }

        .video-item {
            display: grid;
            grid-template-columns: minmax(200px, 1fr) 100px 150px 72px;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            transition: background-color 0.12s ease;
            cursor: pointer;
            position: absolute;
            left: 0;
            right: 0;
            height: 56px;
        }

        .video-item:hover {
            background: var(--surface-hover);
        }

        .video-item:last-child {
            border-bottom: none;
        }

        .video-info {
            min-width: 0;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .video-name {
            font-weight: 500;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .video-ext {
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .video-size {
            text-align: right;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .video-date {
            color: var(--text-tertiary);
            font-size: 13px;
        }

        .video-action {
            text-align: right;
        }

        .play-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .play-btn:hover {
            background: var(--accent-light);
        }

        .play-btn svg {
            width: 12px;
            height: 12px;
        }

        .empty {
            text-align: center;
            padding: 56px 20px;
            color: var(--text-tertiary);
        }

        .empty svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.35;
        }

        /* Player */
        .player-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 1000px;
            background: var(--bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .player-title {
            font-size: 14px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            margin-right: 16px;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .close-btn svg {
            width: 18px;
            height: 18px;
        }

        .video-player {
            width: 100%;
            display: block;
            max-height: calc(100vh - 140px);
            background: #000;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .search-box {
                max-width: none;
            }

            .toolbar-meta {
                justify-content: space-between;
            }

            .list-header,
            .video-item {
                grid-template-columns: minmax(120px, 1fr) 80px 72px;
            }

            .video-date,
            .header-date {
                display: none;
            }

            .video-list {
                max-height: calc(100vh - 200px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div class="brand">
                <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                <h1>视频扫描器</h1>
            </div>
            <div class="addresses">{addresses}</div>
        </header>

        <div class="toolbar">
            <div class="search-box">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="搜索视频..." oninput="filterVideos()">
            </div>
            <div class="toolbar-meta">
                <div class="stat"><span class="stat-value" id="totalCount">0</span><span>个视频</span></div>
                <div class="stat"><span class="stat-value" id="totalSize">0 B</span></div>
                <button class="refresh-btn" onclick="refreshVideos()" id="refreshBtn" title="刷新列表">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path></svg>
                    刷新
                </button>
            </div>
        </div>

        <div class="video-list" id="videoList">
            <div class="list-header">
                <button class="header-name active" onclick="sortVideos('name', this)">文件名</button>
                <button class="header-size" onclick="sortVideos('size', this)">大小</button>
                <button class="header-date" onclick="sortVideos('modified', this)">修改日期</button>
                <div class="header-action"></div>
            </div>
        </div>

        <div class="player-overlay" id="playerOverlay" onclick="closePlayer(event)">
            <div class="player-container" onclick="event.stopPropagation()">
                <div class="player-header">
                    <span class="player-title" id="playerTitle"></span>
                    <button class="close-btn" onclick="closePlayer()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <video id="videoPlayer" controls autoplay class="video-player">
                    您的浏览器不支持视频播放
                </video>
            </div>
        </div>
    </div>

    <script>
        const ITEM_HEIGHT = 56;
        const BUFFER_ITEMS = 5;

        let videos = [];
        let lastEtag = '';
        let currentSort = { field: 'name', order: 'asc' };
        let searchTerm = '';
        let isRefreshing = false;
        let searchDebounceTimer = null;
        let pendingScrollUpdate = false;

        async function fetchVideos() {
            try {
                const response = await fetch('/videos', {
                    cache: 'no-cache',
                    headers: { 'Cache-Control': 'no-cache' }
                });
                if (response.ok) {
                    // ETag 未变化说明视频列表没有更新，跳过全量重渲染
                    const etag = response.headers.get('ETag');
                    if (etag && etag === lastEtag) return;
                    lastEtag = etag || '';
                    const data = await response.json();
                    videos = data;
                    renderVideos();
                } else {
                    console.error('获取视频列表失败:', response.status);
                }
            } catch (error) {
                console.error('获取视频列表出错:', error);
            }
        }

        async function pollRefreshStatus() {
            const startTime = Date.now();
            const timeout = 30000;
            const interval = 800;

            while (Date.now() - startTime < timeout) {
                try {
                    const response = await fetch('/refresh-status', {
                        cache: 'no-cache',
                        headers: { 'Cache-Control': 'no-cache' }
                    });
                    const result = await response.json();

                    if (result.message !== '无刷新记录') {
                        return result;
                    }
                } catch (error) {
                    console.error('轮询刷新状态出错:', error);
                }

                await new Promise(resolve => setTimeout(resolve, interval));
            }

            throw new Error('刷新超时，请稍后重试');
        }

        async function refreshVideos() {
            if (isRefreshing) return;
            isRefreshing = true;

            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.classList.add('spinning');
            refreshBtn.disabled = true;

            try {
                const response = await fetch('/refresh', {
                    cache: 'no-cache',
                    headers: { 'Cache-Control': 'no-cache' }
                });
                const result = await response.json();

                if (response.ok || response.status === 202) {
                    if (!result.success) {
                        alert(result.message || '刷新失败，请重试');
                        return;
                    }

                    const status = await pollRefreshStatus();
                    if (status.success) {
                        await fetchVideos();
                    } else {
                        alert(status.message || '刷新失败，请重试');
                    }
                } else {
                    alert(result.message || '刷新失败，请重试');
                }
            } catch (error) {
                console.error('刷新出错:', error);
                alert('刷新出错: ' + error.message);
            } finally {
                isRefreshing = false;
                refreshBtn.classList.remove('spinning');
                refreshBtn.disabled = false;
            }
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function openPlayer(url, name) {
            document.getElementById('playerTitle').textContent = name;
            document.getElementById('videoPlayer').src = url;
            document.getElementById('playerOverlay').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closePlayer(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('playerOverlay').style.display = 'none';
            document.getElementById('videoPlayer').pause();
            document.getElementById('videoPlayer').src = '';
            document.body.style.overflow = '';
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function createVideoItemElement(v, index) {
            const item = document.createElement('div');
            item.className = 'video-item';
            item.dataset.index = index;
            item.style.top = (index * ITEM_HEIGHT) + 'px';
            item.innerHTML = `
                <div class="video-info">
                    <span class="video-name">${escapeHtml(v.name)}</span>
                    <span class="video-ext">${escapeHtml(v.extension)}</span>
                </div>
                <div class="video-size">${formatSize(v.size)}</div>
                <div class="video-date">${escapeHtml(v.modified || '-')}</div>
                <div class="video-action">
                    <button class="play-btn" aria-label="播放">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    </button>
                </div>
            `;
            return item;
        }

        function updateVisibleItems(list) {
            const filtered = list._videos;
            if (!filtered || filtered.length === 0) return;

            const scrollTop = list.scrollTop;
            const viewportHeight = list.clientHeight;
            const startIndex = Math.max(0, Math.floor(scrollTop / ITEM_HEIGHT) - BUFFER_ITEMS);
            const endIndex = Math.min(
                filtered.length - 1,
                Math.ceil((scrollTop + viewportHeight) / ITEM_HEIGHT) + BUFFER_ITEMS
            );

            let next = list.firstElementChild;
            while (next) {
                const current = next;
                next = current.nextElementSibling;
                if (current.classList.contains('video-item')) {
                    current.remove();
                }
            }

            for (let i = startIndex; i <= endIndex; i++) {
                list.appendChild(createVideoItemElement(filtered[i], i));
            }
        }

        function scheduleUpdateVisibleItems() {
            if (pendingScrollUpdate) return;
            pendingScrollUpdate = true;
            requestAnimationFrame(() => {
                pendingScrollUpdate = false;
                updateVisibleItems(document.getElementById('videoList'));
            });
        }

        function renderVideos() {
            let filtered = videos.filter(v =>
                v.name.toLowerCase().includes(searchTerm.toLowerCase())
            );

            filtered.sort((a, b) => {
                let valA, valB;
                if (currentSort.field === 'name') {
                    valA = a.name.toLowerCase();
                    valB = b.name.toLowerCase();
                } else if (currentSort.field === 'size') {
                    valA = a.size;
                    valB = b.size;
                } else {
                    valA = a.modified || '';
                    valB = b.modified || '';
                }

                if (valA < valB) return currentSort.order === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.order === 'asc' ? 1 : -1;
                return 0;
            });

            const list = document.getElementById('videoList');
            const header = list.querySelector('.list-header');
            list.innerHTML = '';
            list.appendChild(header);
            list._videos = filtered;
            list.scrollTop = 0;

            if (filtered.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty';
                empty.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    <div>没有找到视频</div>
                `;
                list.appendChild(empty);
                document.getElementById('totalCount').textContent = '0';
                document.getElementById('totalSize').textContent = '0 B';
                return;
            }

            const spacer = document.createElement('div');
            spacer.className = 'video-scroll-spacer';
            spacer.style.height = (filtered.length * ITEM_HEIGHT) + 'px';
            list.appendChild(spacer);

            updateVisibleItems(list);

            document.getElementById('totalCount').textContent = filtered.length;
            const totalBytes = filtered.reduce((sum, v) => sum + v.size, 0);
            document.getElementById('totalSize').textContent = formatSize(totalBytes);
        }

        function sortVideos(field, btn) {
            if (currentSort.field === field) {
                currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.field = field;
                currentSort.order = 'asc';
            }

            document.querySelectorAll('.list-header button').forEach(b => {
                b.classList.remove('active');
                const icon = b.querySelector('.sort-icon');
                if (icon) icon.remove();
            });
            btn.classList.add('active');

            const iconSvg = document.createElement('span');
            iconSvg.className = 'sort-icon';
            iconSvg.innerHTML = currentSort.order === 'asc'
                ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>'
                : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"></path></svg>';
            btn.appendChild(iconSvg);

            renderVideos();
        }

        function filterVideos() {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                searchTerm = document.getElementById('searchInput').value;
                renderVideos();
            }, 250);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closePlayer();
        });

        document.getElementById('videoList').addEventListener('click', function(e) {
            const playBtn = e.target.closest('.play-btn');
            const item = e.target.closest('.video-item');
            if (!item) return;

            const idx = parseInt(item.dataset.index, 10);
            const list = document.getElementById('videoList');
            const v = list._videos && list._videos[idx];
            if (!v) return;

            if (playBtn) {
                e.stopPropagation();
            }
            openPlayer('/video/' + encodeURIComponent(v.relative_path), v.name);
        });

        document.getElementById('videoList').addEventListener('scroll', scheduleUpdateVisibleItems);
        window.addEventListener('resize', scheduleUpdateVisibleItems);

        let pollTimer = null;
        function startPolling() {
            if (pollTimer) return;
            pollTimer = setInterval(fetchVideos, 30000);
        }
        function stopPolling() {
            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }

        document.addEventListener('visibilitychange', function() {
            if (document.hidden) stopPolling();
            else { fetchVideos(); startPolling(); }
        });

        document.addEventListener('DOMContentLoaded', function() {
            fetchVideos();
            startPolling();
        });
    </script>
</body>
</html>
