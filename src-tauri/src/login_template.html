<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>视频扫描器 - 密码验证</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            overflow: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 36px 28px 28px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255,255,255,0.04) inset;
            animation: cardEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
            animation: fadeSlideIn 0.5s 0.1s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .lock-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 14px;
            background: rgba(96, 165, 250, 0.15);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            animation: iconPulse 2s ease-in-out infinite 0.6s;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(96,165,250,.3); }
            50%      { box-shadow: 0 0 0 10px rgba(96,165,250,0); }
        }

        .login-title {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .login-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
        }

        .pin-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            animation: fadeSlideIn 0.5s 0.2s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .pin-box {
            width: 42px;
            height: 52px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 700;
            color: transparent;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .pin-box.has-digit {
            color: #60a5fa;
            border-color: rgba(96, 165, 250, 0.35);
            background: rgba(96, 165, 250, 0.08);
        }

        .pin-box.has-digit.masked {
            color: transparent;
        }

        .pin-box.has-digit.masked::after {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #60a5fa;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.4);
            transition: transform 0.2s ease;
        }

        .pin-box.pop-in {
            animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes popIn {
            0%   { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pin-box.error {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            animation: shake 0.4s ease;
        }

        .pin-box.error::after {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%      { transform: translateX(-5px); }
            40%      { transform: translateX(5px); }
            60%      { transform: translateX(-3px); }
            80%      { transform: translateX(3px); }
        }

        .error-banner {
            text-align: center;
            margin-bottom: 16px;
            min-height: 0;
            opacity: 0;
            transform: translateY(-8px);
            transition: all 0.25s ease;
            pointer-events: none;
        }

        .error-banner.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .error-banner-inner {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 10px;
            color: #fca5a5;
            font-size: 13px;
            font-weight: 500;
        }

        .lockout-banner {
            text-align: center;
            margin-bottom: 16px;
            min-height: 0;
            opacity: 0;
            transform: translateY(-8px);
            transition: all 0.25s ease;
        }

        .lockout-banner.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .lockout-inner {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 18px;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.22);
            border-radius: 10px;
            color: #fcd34d;
            font-size: 13px;
            font-weight: 500;
        }

        .numpad-wrapper {
            position: relative;
            animation: fadeSlideIn 0.5s 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .numpad-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .numpad-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-content {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            font-weight: 500;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .num-btn {
            height: 54px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            font-size: 22px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }

        .num-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(96, 165, 250, 0.3);
        }

        .num-btn:active {
            background: rgba(96, 165, 250, 0.25);
            transform: scale(0.96);
        }

        .num-btn.action {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        .num-btn.delete {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
        }

        .num-btn.delete:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(96, 165, 250, 0.35);
            transform: scale(0);
            animation: rippleOut 0.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes rippleOut {
            to { transform: scale(4); opacity: 0; }
        }

        .success-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .success-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .success-check {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.15);
            border: 2px solid rgba(34, 197, 94, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 16px;
            animation: successPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes successPop {
            0%   { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-text {
            font-size: 15px;
            font-weight: 600;
            color: #4ade80;
        }

        .loading-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            animation: dotBounce 1.2s ease-in-out infinite;
        }

        .loading-dot:nth-child(2) { animation-delay: 0.15s; }
        .loading-dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes dotBounce {
            0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-4px); }
        }

        @media (max-width: 380px) {
            .login-card { padding: 28px 20px 22px; }
            .pin-box { width: 38px; height: 48px; font-size: 23px; }
            .num-btn { height: 48px; font-size: 20px; }
            .numpad { gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="lock-icon">🔒</div>
                <div class="login-title">视频扫描器</div>
                <div class="login-subtitle">请输入 4 位数字密码访问共享资源</div>
            </div>

            <div class="pin-display" id="pinDisplay">
                <div class="pin-box" id="box0"></div>
                <div class="pin-box" id="box1"></div>
                <div class="pin-box" id="box2"></div>
                <div class="pin-box" id="box3"></div>
            </div>

            <div class="error-banner" id="errorBanner">
                <div class="error-banner-inner">
                    <span>⚠️</span>
                    <span id="errorMsg"></span>
                </div>
            </div>

            <div class="lockout-banner" id="lockoutBanner">
                <div class="lockout-inner">
                    <span>🔒</span>
                    <span id="lockoutMsg"></span>
                </div>
            </div>

            <div class="numpad-wrapper">
                <div class="numpad-overlay" id="numpadOverlay">
                    <div class="overlay-content">
                        <span class="loading-dot"></span>
                        <span class="loading-dot"></span>
                        <span class="loading-dot"></span>
                        <span>验证中</span>
                    </div>
                </div>
                <div class="numpad" id="numpad">
                    <button class="num-btn" data-key="1">1</button>
                    <button class="num-btn" data-key="2">2</button>
                    <button class="num-btn" data-key="3">3</button>
                    <button class="num-btn" data-key="4">4</button>
                    <button class="num-btn" data-key="5">5</button>
                    <button class="num-btn" data-key="6">6</button>
                    <button class="num-btn" data-key="7">7</button>
                    <button class="num-btn" data-key="8">8</button>
                    <button class="num-btn" data-key="9">9</button>
                    <button class="num-btn action" data-action="clear">清除</button>
                    <button class="num-btn" data-key="0">0</button>
                    <button class="num-btn delete" data-action="delete">⌫</button>
                </div>
            </div>
        </div>
    </div>

    <div class="success-overlay" id="successOverlay">
        <div class="success-check">✓</div>
        <div class="success-text">验证成功，正在跳转...</div>
    </div>

    <script>
        let pin = '';
        let isSubmitting = false;
        let isLocked = false;
        const MASK_DELAY = 650;

        function updateBoxes(animateIndex) {
            for (let i = 0; i < 4; i++) {
                const box = document.getElementById('box' + i);
                if (i < pin.length) {
                    box.textContent = pin[i];
                    box.className = 'pin-box has-digit';
                    if (i === animateIndex) {
                        box.classList.add('pop-in');
                        setTimeout(() => box.classList.remove('pop-in'), 200);
                    }
                    setTimeout(() => {
                        if (box.textContent === pin[i]) {
                            box.classList.add('masked');
                            box.textContent = '';
                        }
                    }, MASK_DELAY);
                } else {
                    box.textContent = '';
                    box.className = 'pin-box';
                }
            }
        }

        function showError(msg) {
            const banner = document.getElementById('errorBanner');
            document.getElementById('errorMsg').textContent = msg;
            banner.classList.add('visible');
            const boxes = document.querySelectorAll('.pin-box.has-digit');
            boxes.forEach(b => b.classList.add('error'));
            setTimeout(() => {
                banner.classList.remove('visible');
                boxes.forEach(b => b.classList.remove('error'));
                pin = '';
                updateBoxes(-1);
            }, 700);
        }

        function clearError() {
            document.getElementById('errorBanner').classList.remove('visible');
            document.getElementById('lockoutBanner').classList.remove('visible');
        }

        function showLoading(show) {
            document.getElementById('numpadOverlay').classList.toggle('active', show);
        }

        function showSuccess() {
            document.getElementById('successOverlay').classList.add('active');
            setTimeout(() => { window.location.href = '/'; }, 800);
        }

        function createRipple(btn, e) {
            const rect = btn.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = (e.clientX || e.touches?.[0]?.clientX || rect.width / 2) - rect.left - size / 2;
            const y = (e.clientY || e.touches?.[0]?.clientY || rect.height / 2) - rect.top - size / 2;
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            ripple.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px`;
            btn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 500);
        }

        function inputDigit(d) {
            if (isSubmitting || isLocked || pin.length >= 4) return;
            clearError();
            const idx = pin.length;
            pin += d;
            updateBoxes(idx);
            if (pin.length === 4) submitPin();
        }

        function deleteDigit() {
            if (isSubmitting || isLocked || pin.length === 0) return;
            clearError();
            pin = pin.slice(0, -1);
            updateBoxes(-1);
        }

        function clearInput() {
            if (isSubmitting || isLocked) return;
            clearError();
            pin = '';
            updateBoxes(-1);
        }

        async function submitPin() {
            if (isSubmitting || isLocked) return;
            isSubmitting = true;
            showLoading(true);

            try {
                const response = await fetch('/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pin })
                });

                const data = await response.json();

                if (data.success) {
                    showLoading(false);
                    showSuccess();
                } else {
                    showLoading(false);
                    isSubmitting = false;
                    if (data.message && data.message.includes('锁定')) {
                        isLocked = true;
                        const match = data.message.match(/(\d+)秒/);
                        let totalSeconds = match ? parseInt(match[1], 10) : 30;
                        const lockoutBanner = document.getElementById('lockoutBanner');
                        const lockoutMsg = document.getElementById('lockoutMsg');

                        function updateCountdown() {
                            if (totalSeconds <= 0) {
                                clearInterval(countdownTimer);
                                isLocked = false;
                                lockoutBanner.classList.remove('visible');
                                return;
                            }
                            lockoutMsg.textContent = '连续失败次数过多，请 ' + totalSeconds + ' 秒后重试';
                            lockoutBanner.classList.add('visible');
                            totalSeconds--;
                        }

                        updateCountdown();
                        const countdownTimer = setInterval(updateCountdown, 1000);
                    } else {
                        showError(data.message || '密码错误，请重试');
                    }
                }
            } catch (error) {
                showLoading(false);
                isSubmitting = false;
                showError('网络错误，请重试');
            }
        }

        document.querySelectorAll('.num-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                createRipple(this, e);
                if (this.dataset.key) inputDigit(this.dataset.key);
                else if (this.dataset.action === 'delete') deleteDigit();
                else if (this.dataset.action === 'clear') clearInput();
            });
        });

        document.addEventListener('keydown', function(e) {
            if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
            else if (e.key === 'Backspace') deleteDigit();
            else if (e.key === 'Escape') clearInput();
        });
    </script>
</body>
</html>
