name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    # 必须用 Windows runner：utils.rs / video.rs 的路径与符号链接测试依赖 Windows
    # 语义（例如断言 "C:\" 是根目录），在 Linux 上会失败
    runs-on: windows-latest

    steps:
      # 下列 action 须保持在使用 Node24 的版本线（checkout / setup-node / pnpm-action-setup
      # 均为 v5 起）：runner 已把声明 node20 的 action 强制跑在 Node24 上，且 Node20 定于
      # 2026-09-23 移除，届时仍用旧版会直接失败
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # pnpm-workspace.yaml 的 allowBuilds 是 pnpm 11 设置，版本不能低于 11
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend type check
        run: pnpm check

      - name: Frontend build
        run: pnpm build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # 默认跳过、需要真实前端产物的端到端校验（build/ 由上面的 pnpm build 生成）。
      # 显式在这一步执行，使"必须先构建前端"的测试被真实覆盖而不是静默跳过。
      - name: Rust tests (real frontend build)
        working-directory: src-tauri
        run: cargo test -- --ignored
